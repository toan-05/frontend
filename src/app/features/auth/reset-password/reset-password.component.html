<!-- THEME SOURCE: snippets/pages/user/login-1.html:126 m-login__forget-password - Y nguyên, chỉ thêm 2 field newPassword/confirm + token -->
<div class="m-login__forget-password">
  <div class="m-login__head">
    <h3 class="m-login__title">Đặt lại mật khẩu</h3>
    <div class="m-login__desc">Nhập token và mật khẩu mới:</div>
  </div>
  <form class="m-login__form m-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group m-form__group" [class.has-danger]="form.controls.token.touched && form.controls.token.invalid">
      <input class="form-control m-input" type="text" placeholder="Token" name="token" autocomplete="off" formControlName="token" [class.is-invalid]="form.controls.token.touched && form.controls.token.invalid">
      <div *ngIf="form.controls.token.touched && form.controls.token.invalid" class="form-control-feedback">Token là bắt buộc (lấy từ email)</div>
      <span class="m-form__help">Token được gửi qua email khi bạn yêu cầu quên mật khẩu. Hoặc truy cập /reset-password?token=xxx</span>
    </div>
    <div class="form-group m-form__group" [class.has-danger]="form.controls.newPassword.touched && form.controls.newPassword.invalid">
      <input class="form-control m-input" type="password" placeholder="Mật khẩu mới" name="newPassword" formControlName="newPassword" [class.is-invalid]="form.controls.newPassword.touched && form.controls.newPassword.invalid">
      <div *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('required')" class="form-control-feedback">Mật khẩu mới là bắt buộc</div>
      <div *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')" class="form-control-feedback">Tối thiểu 6 ký tự</div>
    </div>
    <div class="form-group m-form__group" [class.has-danger]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid">
      <input class="form-control m-input m-login__form-input--last" type="password" placeholder="Nhập lại mật khẩu" name="confirmPassword" formControlName="confirmPassword" [class.is-invalid]="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid">
      <div *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid" class="form-control-feedback">Vui lòng xác nhận mật khẩu</div>
    </div>
    <div class="m-login__form-action">
      <button type="submit" id="m_login_reset_password_submit" class="btn btn-focus m-btn m-btn--pill m-btn--custom m-btn--air" [disabled]="loading">
        <span *ngIf="!loading">Đặt lại mật khẩu</span>
        <span *ngIf="loading"><i class="fa fa-spinner fa-spin"></i> Đang xử lý...</span>
      </button>
      <button type="button" class="btn btn-outline-focus m-btn m-btn--pill m-btn--custom" routerLink="/login">Cancel</button>
    </div>
    <div class="m--margin-top-10" style="text-align:center;">
      <a routerLink="/forgot-password" class="m-link m-link--focus">Quay lại quên mật khẩu</a>
    </div>
  </form>
</div>
