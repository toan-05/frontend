<!-- THEME SOURCE: login-1.html:126 m-login__forget-password - Y nguyên -->
<div class="m-login__forget-password">
  <div class="m-login__head">
    <h3 class="m-login__title">Forgotten Password ?</h3>
    <div class="m-login__desc">Enter your email to reset your password:</div>
  </div>
  <form class="m-login__form m-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group m-form__group" [class.has-danger]="form.controls.email.touched && form.controls.email.invalid">
      <input class="form-control m-input" type="text" placeholder="Email" name="email" id="m_email" autocomplete="off" formControlName="email" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
      <div *ngIf="form.controls.email.touched && form.controls.email.invalid" class="form-control-feedback">Email không hợp lệ</div>
    </div>
    <div class="m-login__form-action">
      <button type="submit" id="m_login_forget_password_submit" class="btn btn-focus m-btn m-btn--pill m-btn--custom m-btn--air" [disabled]="loading">
        <span *ngIf="!loading">Request</span>
        <span *ngIf="loading"><i class="fa fa-spinner fa-spin"></i> Đang gửi...</span>
      </button>
      <button type="button" id="m_login_forget_password_cancel" class="btn btn-outline-focus m-btn m-btn--pill m-btn--custom" routerLink="/login">Cancel</button>
    </div>
    <div class="m--margin-top-10" style="text-align:center;">
      <a routerLink="/reset-password" class="m-link m-link--focus">Đã có token? Đặt lại mật khẩu</a>
    </div>
  </form>
</div>
